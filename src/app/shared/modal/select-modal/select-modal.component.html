<div [style.width]="width">
  <mat-form-field appearance="outline" class="w-full select-field-custom">
    <mat-label class="text-gray-600">{{ placeholder }}</mat-label>
    <mat-select [formControl]="selectControl" [multiple]="multiple" class="text-sm">
      <mat-option *ngFor="let option of options" [value]="option.value">
        {{ option.label }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>
