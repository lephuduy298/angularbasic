<div [style.width]="width" class="w-full">
  <mat-form-field appearance="fill" class="w-full">
    <mat-label>{{ placeholder }}</mat-label>
    <mat-select [formControl]="selectControl" [multiple]="multiple">
      <!-- Custom trigger for multiple selection -->
      @if (multiple) {
        <mat-select-trigger>
          {{ getFirstSelectedLabel() }}
          @if (getSelectedCount() > 1) {
            <span class="opacity-75 text-xs ml-1">
              (+{{ getSelectedCount() - 1 }} {{ getSelectedCount() === 2 ? 'other' : 'others' }})
            </span>
          }
        </mat-select-trigger>
      }

      @for (option of options; track option.value) {
        <mat-option [value]="option.value">
          {{ option.label }}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
